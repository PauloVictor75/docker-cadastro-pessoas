services:

  frontend:
    build: ./frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - cadastro_network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cadastro}
      DB_USER: ${DB_USER:-cadastro_user}
      DB_PASSWORD: ${DB_PASSWORD:-cadastro_pass}
    depends_on:
      - mysql
    networks:
      - cadastro_network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-cadastro}
      MYSQL_USER: ${DB_USER:-cadastro_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cadastro_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cadastro_network

networks:
  cadastro_network:
    driver: bridge

volumes:
  mysql_data:
